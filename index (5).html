<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JEE 2027 Countdown</title>
<style>
:root{--acc:#ff8a3d;--fg:#f6e7d0;--dim:#c3ad9a;--ink:#f6e7d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
.b{stroke:#f6e7d0;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.w{fill:none;stroke:#f6e7d0;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.lb{font-family:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;font-size:21px;fill:#f6e7d0;text-anchor:middle}
body{margin:0;min-height:100%;padding-bottom:min(24vw,300px);position:relative;z-index:1;color:var(--fg);font-family:"Segoe UI",system-ui,Arial,sans-serif;display:flex;flex-direction:column;justify-content:center;text-align:center}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#261a2b}
#bg:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(246,231,208,.06) 1.2px,transparent 1.4px);background-size:28px 28px;pointer-events:none}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 2s ease,visibility 0s 2s}
.scene.on{opacity:1;visibility:visible;transition:opacity 2s ease}
.scene:not(.on) *{animation-play-state:paused !important}
.art{position:absolute;inset:0;width:100%;height:100%}
.pulse{animation:pulse 5s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.7}to{opacity:1}}
.steam{animation:steam 4.5s ease-out infinite}
.steam.s2{animation-delay:-2.2s}
@keyframes steam{0%{transform:translateY(0);opacity:0}25%{opacity:.8}100%{transform:translateY(-26px);opacity:0}}
.shim{animation:shim 3.5s ease-in-out infinite alternate}
@keyframes shim{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
.train{animation:ride 90s linear infinite;animation-delay:-30s}
@keyframes ride{from{transform:translateX(-780px)}to{transform:translateX(1700px)}}
.blink{animation:blink 2.2s steps(1) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:.15}}
.beam{animation:sweep 9s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-2deg)}to{transform:rotate(4deg)}}
#strip{position:fixed;left:6%;right:6%;bottom:max(10px,env(safe-area-inset-bottom));height:46px;z-index:0;pointer-events:none}
#strip .track{position:absolute;left:0;right:0;bottom:6px;border-top:2px dashed rgba(246,231,208,.4)}
.flag{position:absolute;bottom:6px;width:0}
.flag span{position:absolute;bottom:22px;left:0;transform:translateX(-50%);font-size:10px;letter-spacing:.08em;color:var(--dim);white-space:nowrap}
.flag i{position:absolute;left:0;bottom:0;width:2px;height:18px;background:rgba(246,231,208,.55)}
.flag i:after{content:"";position:absolute;left:2px;top:0;border-left:11px solid rgba(246,231,208,.35);border-top:5px solid transparent;border-bottom:5px solid transparent}
.flag.on i:after{border-left-color:#ff8a3d}
#walker{position:absolute;bottom:6px;left:0;width:20px;height:36px;transform:translateX(-50%);animation:bob .9s ease-in-out infinite}
#walker svg{display:block}
@keyframes bob{50%{transform:translateX(-50%) translateY(-2px)}}
#cap{position:fixed;right:6%;bottom:66px;z-index:0;pointer-events:none;opacity:0;font-family:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;font-size:clamp(12px,1.5vw,17px);color:var(--fg)}
#cap.show{animation:capfade 7s ease forwards}
@keyframes capfade{0%{opacity:0}12%{opacity:.85}80%{opacity:.85}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse,.steam,.shim,.train,.blink,.beam,#walker{animation:none}}
.top{padding:20px 16px 0}
h1{font-family:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;font-size:clamp(15px,3vw,26px);letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px;font-weight:700;color:var(--ink)}
.date{color:var(--acc);font-weight:800;letter-spacing:.25em;font-size:clamp(12px,2.6vw,18px)}
.bottom{padding:24px 12px 10px}
.clock{display:flex;justify-content:center;align-items:flex-start;gap:clamp(4px,1.6vw,20px)}
.unit{min-width:clamp(62px,15vw,150px)}
.num{font-family:"Courier New",monospace;font-size:clamp(38px,11vw,100px);font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(255,138,61,.25)}
.unit:last-of-type .num{color:var(--acc)}
.sep{font-family:"Courier New",monospace;font-size:clamp(38px,11vw,100px);font-weight:700;line-height:1;color:var(--acc);opacity:.6}
.lab{margin-top:8px;font-size:clamp(9px,2vw,13px);letter-spacing:.3em;text-transform:uppercase;color:var(--dim);font-weight:700}
.phase{display:inline-block;margin-top:14px;padding:5px 16px;border:1.5px dashed rgba(255,138,61,.7);border-radius:999px;color:var(--acc);font-size:clamp(11px,2.2vw,14px);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.sub.ms{color:var(--acc);font-weight:700}
.sub{margin-top:14px;color:var(--fg);font-size:clamp(13px,2.8vw,16px)}
.quote{margin:10px auto 0;max-width:min(640px,92vw);font-family:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;font-size:clamp(13px,2.6vw,17px);color:var(--acc);line-height:1.4}
.ctl{margin-top:12px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap}
button{background:var(--acc);color:#2a1c2e;border:2px solid var(--acc);border-radius:999px;padding:10px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.off{background:transparent;color:var(--acc)}
.vol{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:14px}
.vol input{width:min(200px,45vw);accent-color:var(--acc)}
.note{margin-top:10px;font-size:11px;color:var(--dim)}
</style>
</head>

var samples = [null, null], loaded = false;
function loadSamples(){
  if(loaded || !ctx) return; loaded = true;
  [TICK_B64, TOCK_B64].forEach(function(b, i){
    var bin = atob(b), u = new Uint8Array(bin.length);
    for(var j = 0; j < bin.length; j++) u[j] = bin.charCodeAt(j);
    try{ ctx.decodeAudioData(u.buffer, function(buf){ samples[i] = buf; }, function(){}); }catch(e){}
  });
}

  } else mech(flip ? 150 : 115, 0.7);
}

};

    var day = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
    var i = day % Q.length;
    if(i !== last){ last = i; el.textContent = "\u201C" + Q[i] + "\u201D"; }
  }
  show(); setInterval(show, 60000);
})();

function pad(n, l){ n = String(n); while(n.length < l) n = "0" + n; return n; }

var START = new Date("2026-10-03T00:00:00+05:30").getTime();
var P2 = new Date("2026-12-01T00:00:00+05:30").getTime(), P3 = new Date("2027-01-01T00:00:00+05:30").getTime();
var MILES = [100, 50, 30, 10], TOTALD = (TARGET - START) / 86400000;
var strip = document.getElementById("strip"), flagEls = [];
MILES.forEach(function(m){
  var d = document.createElement("div"); d.className = "flag";
  d.style.left = ((TOTALD - m) / TOTALD * 100).toFixed(2) + "%";
  d.innerHTML = "<span>" + m + "</span><i></i>";
  strip.appendChild(d); flagEls.push({m: m, el: d});
});
function paintProgress(){
  var now = Date.now(), p = Math.max(0, Math.min(1, (now - START) / (TARGET - START)));
  document.getElementById("walker").style.left = (p * 100).toFixed(2) + "%";
  flagEls.forEach(function(f){ f.el.className = p >= (TOTALD - f.m) / TOTALD ? "flag on" : "flag"; });
  var ph = document.getElementById("phase");
  ph.textContent = now >= TARGET ? "Exam day \u2014 all the best!" :
    now < P2 ? "Phase 1 of 3 \u00B7 Finish the syllabus" :
    now < P3 ? "Phase 2 of 3 \u00B7 Revision & past-year papers" :
               "Phase 3 of 3 \u00B7 Mock tests & final prep";
}
paintProgress(); setInterval(paintProgress, 60000);

var CAPS = ["Mon \u00B7 Campus night", "Tue \u00B7 Study desk", "Wed \u00B7 Road to the hills", "Thu \u00B7 Bridge at dusk", "Fri \u00B7 Night train", "Sat \u00B7 City before dawn", "Sun \u00B7 Lighthouse"];
var scenes = document.querySelectorAll("#bg .scene"), capEl = document.getElementById("cap"), curScene = -1;
function showScene(i){
  if(i === curScene) return; curScene = i;
  for(var k = 0; k < scenes.length; k++) scenes[k].className = k === i ? "scene on" : "scene";
  capEl.textContent = CAPS[i]; capEl.className = ""; void capEl.offsetWidth; capEl.className = "show";
}
function todayIdx(){ return (new Date().getDay() + 6) % 7; }
var SQ = location.search.match(/[?&]scene=(\w+)/), SC = SQ ? SQ[1] : "";
if(SC === "all"){ var ai = 0; showScene(0); setInterval(function(){ ai = (ai + 1) % 7; showScene(ai); }, 5000); }
else if(/^[1-7]$/.test(SC)){ showScene(+SC - 1); }
else { showScene(todayIdx()); setInterval(function(){ showScene(todayIdx()); }, 30000); }
function milestoneBell(){ chime(); setTimeout(chime, 1600); setTimeout(chime, 3200); }
var lastD = null;

function update(){
  var diff = TARGET - Date.now();
  if(diff <= 0){
    ["d","h","m","s"].forEach(function(id,i){ document.getElementById(id).textContent = i ? "00" : "000"; });
    document.getElementById("sub").textContent = "The day is here. All the best! 🔥";
    if(lastSec !== -1){ lastSec = -1; alarm(); }
    return;
  }
  var total = Math.floor(diff / 1000);
  var d = Math.floor(total / 86400), h = Math.floor(total % 86400 / 3600),
      m = Math.floor(total % 3600 / 60), s = total % 60;
  document.getElementById("d").textContent = pad(d, 3);
  document.getElementById("h").textContent = pad(h, 2);
  document.getElementById("m").textContent = pad(m, 2);
  document.getElementById("s").textContent = pad(s, 2);
  var subEl = document.getElementById("sub"), ms = MILES.indexOf(d) >= 0;
  subEl.textContent = ms ? "\uD83D\uDEA9 " + d + " days to go! Keep the pace." : Math.floor(d / 7) + " weeks and " + (d % 7) + " days to go. Every day counts.";
  subEl.className = ms ? "sub ms" : "sub";
  if(d !== lastD){
    document.title = d + " days to JEE 2027";
    if(lastD !== null && ms) milestoneBell();
    lastD = d;
  }
  if(total !== lastSec){
    if(total <= 10) boom();
    else tick();
    if(lastHour !== null && h !== lastHour && total > 10) chime();
    lastSec = total; lastHour = h;
  }
}
update();
setInterval(update, 250);
</script>
