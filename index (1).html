<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JEE 2027 Countdown</title>
<style>
:root{--bg:#07080c;--fg:#f4f1ea;--dim:#8a8f9c;--acc:#ff3b30;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.st{animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
body{margin:0;min-height:100%;background:var(--bg);position:relative;z-index:1;color:var(--fg);font-family:"Segoe UI",system-ui,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
h1{font-size:clamp(14px,3vw,20px);letter-spacing:.35em;text-transform:uppercase;color:var(--dim);margin:0 0 8px;font-weight:600}
.date{color:var(--acc);font-weight:700;letter-spacing:.2em;margin-bottom:32px;font-size:clamp(13px,3vw,18px)}
.clock{display:flex;gap:clamp(8px,2.5vw,28px);flex-wrap:wrap;justify-content:center}
.box{min-width:clamp(70px,20vw,170px);padding:18px 8px;border:1px solid #2a2d38;border-radius:14px;background:rgba(8,9,14,.68);backdrop-filter:blur(4px)}
.num{font-family:"Courier New",monospace;font-size:clamp(40px,12vw,110px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.box:last-child .num{color:var(--acc)}
.lab{margin-top:10px;font-size:clamp(10px,2.5vw,14px);letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.sub{margin-top:28px;color:var(--dim);font-size:clamp(13px,3vw,16px)}
button{margin-top:28px;background:var(--acc);color:#fff;border:0;border-radius:999px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer}
button.off{background:#2a2d38;color:var(--fg)}
.note{margin-top:10px;font-size:12px;color:var(--dim)}
</style>
</head>

var samples = [null, null], loaded = false;
function loadSamples(){
  if(loaded || !ctx) return; loaded = true;
  [TICK_B64, TOCK_B64].forEach(function(b, i){
    var bin = atob(b), u = new Uint8Array(bin.length);
    for(var j = 0; j < bin.length; j++) u[j] = bin.charCodeAt(j);
    try{ ctx.decodeAudioData(u.buffer, function(buf){ samples[i] = buf; }, function(){}); }catch(e){}
  });
}
function tick(){
  flip = !flip;
  var b = samples[flip ? 0 : 1];
  if(b && soundOn && ctx){
    var src = ctx.createBufferSource(); src.buffer = b;
    src.connect(ctx.destination); src.start();
  } else mech(flip ? 150 : 115, 0.7);
}
function boom(){ tick(); }
function chime(){ beep(220, 2.5, 0.35); beep(330, 2, 0.15); beep(440, 1.5, 0.08); }
function alarm(){ for(var i=0;i<8;i++){ (function(i){ setTimeout(function(){ beep(i%2?900:700, 0.4, 0.3, "sawtooth"); }, i*450); })(i); } }

var btn = document.getElementById("snd");
btn.onclick = function(){
  try{
    if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === "suspended") ctx.resume();
  }catch(e){ return; }
  loadSamples();
  soundOn = !soundOn;
  btn.textContent = soundOn ? "🔊 Sound on" : "🔇 Turn sound on";
  btn.className = soundOn ? "" : "off";
  if(soundOn) tick();
};

(function buildBg(){
  var s = '<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04050c"/><stop offset=".55" stop-color="#1a1030"/><stop offset=".85" stop-color="#7a2a2e"/><stop offset="1" stop-color="#e0702d"/></linearGradient>' +
    '<linearGradient id="veil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05060c" stop-opacity=".6"/><stop offset="1" stop-color="#05060c" stop-opacity=".1"/></linearGradient></defs>' +
    '<rect width="1200" height="700" fill="url(#sky)"/>';
  var seed = 7;
  function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for(var i = 0; i < 80; i++){
    s += '<circle class="st" style="animation-delay:' + (rnd() * 3).toFixed(1) + 's" cx="' + (rnd() * 1200).toFixed(0) + '" cy="' + (rnd() * 360).toFixed(0) + '" r="' + (rnd() * 1.4 + .4).toFixed(1) + '" fill="#fff"/>';
  }
  s += '<circle cx="1010" cy="95" r="70" fill="#f4efe0" opacity=".08"/><circle cx="1010" cy="95" r="28" fill="#f4efe0" opacity=".92"/>';
  var B = '#090a12';
  s += '<rect x="0" y="640" width="1200" height="60" fill="#05060a"/>' +
    '<rect x="150" y="470" width="900" height="175" fill="' + B + '"/>' +
    '<rect x="450" y="400" width="300" height="245" fill="' + B + '"/>' +
    '<rect x="555" y="250" width="90" height="150" fill="' + B + '"/>' +
    '<polygon points="550,250 600,165 650,250" fill="' + B + '"/>' +
    '<rect x="598" y="130" width="4" height="40" fill="' + B + '"/>';
  [210, 330, 870, 990].forEach(function(x){
    s += '<rect x="' + (x - 22) + '" y="432" width="44" height="40" fill="' + B + '"/><path d="M' + (x - 22) + ' 432 A22 22 0 0 1 ' + (x + 22) + ' 432Z" fill="' + B + '"/><rect x="' + (x - 1.5) + '" y="396" width="3" height="14" fill="' + B + '"/>';
  });
  s += '<circle cx="600" cy="305" r="30" fill="#f6d98a"/><circle cx="600" cy="305" r="30" fill="none" stroke="#090a12" stroke-width="3"/>' +
    '<line x1="600" y1="305" x2="600" y2="286" stroke="#090a12" stroke-width="3"/><line x1="600" y1="305" x2="614" y2="312" stroke="#090a12" stroke-width="3"/>';
  function wins(x0, x1, rows, step){
    for(var y of rows) for(var x = x0; x <= x1; x += step){
      s += '<rect x="' + x + '" y="' + y + '" width="12" height="20" rx="5" fill="' + (rnd() > .35 ? '#ffd27a' : '#161827') + '"' + (rnd() > .7 ? ' opacity=".6"' : '') + '/>';
    }
  }
  wins(170, 420, [490, 535, 580], 32);
  wins(780, 1030, [490, 535, 580], 32);
  wins(470, 530, [420, 465, 510, 555], 32);
  wins(670, 730, [420, 465, 510, 555], 32);
  s += '<path d="M570 640 V585 A30 30 0 0 1 630 585 V640Z" fill="#f0b04a" opacity=".85"/>' +
    '<rect x="520" y="636" width="160" height="8" fill="#161827"/>';
  [60, 120, 210, 300, 900, 990, 1080, 1150].forEach(function(x, i){
    s += '<ellipse cx="' + x + '" cy="' + (655 - (i % 3) * 8) + '" rx="' + (38 + i % 3 * 8) + '" ry="' + (45 + i % 2 * 12) + '" fill="#04050a"/>';
  });
  s += '<rect width="1200" height="700" fill="url(#veil)"/>';
  document.getElementById("bg").innerHTML = s;
})();

function pad(n, l){ n = String(n); while(n.length < l) n = "0" + n; return n; }

function update(){
  var diff = TARGET - Date.now();
  if(diff <= 0){
    ["d","h","m","s"].forEach(function(id,i){ document.getElementById(id).textContent = i ? "00" : "000"; });
    document.getElementById("sub").textContent = "The day is here. All the best! 🔥";
    if(lastSec !== -1){ lastSec = -1; alarm(); }
    return;
  }
  var total = Math.floor(diff / 1000);
  var d = Math.floor(total / 86400), h = Math.floor(total % 86400 / 3600),
      m = Math.floor(total % 3600 / 60), s = total % 60;
  document.getElementById("d").textContent = pad(d, 3);
  document.getElementById("h").textContent = pad(h, 2);
  document.getElementById("m").textContent = pad(m, 2);
  document.getElementById("s").textContent = pad(s, 2);
  document.getElementById("sub").textContent = Math.floor(d / 7) + " weeks and " + (d % 7) + " days to go. Every day counts.";
  if(total !== lastSec){
    if(total <= 10) boom();
    else tick();
    if(lastHour !== null && h !== lastHour && total > 10) chime();
    lastSec = total; lastHour = h;
  }
}
update();
setInterval(update, 250);
